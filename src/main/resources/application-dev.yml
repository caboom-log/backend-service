eureka:
  client:
    enabled: false

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_DEV_HOST}:3306/caboomlog
    username: root
    password: ${MYSQL_DEV_PWD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show-sql: true
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

minio:
  url: http://localhost:19000
  access-key: caboomlog-dev
  secret-key: caboomlog-dev
  bucket: caboomlog-dev
  secure: true